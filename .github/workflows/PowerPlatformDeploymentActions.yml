name: Power Platform release
run-name: Release ${{ inputs.solution-name }} to QA and Prod

on:
  workflow_dispatch:
    inputs:
      solution-name:
        description: Unmanaged solution unique name in Dev (not the display name)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: power-platform-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  export:
    name: Export Dev and check solution
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    environment: Dev
    outputs:
      artifact-id: ${{ steps.release.outputs.artifact-id }}
      managed-sha256: ${{ steps.hash.outputs.sha256 }}
    env:
      PP_ENVIRONMENT_URL: ${{ vars.PP_ENVIRONMENT_URL }}
      PP_APP_ID: ${{ vars.PP_APP_ID }}
      PP_TENANT_ID: ${{ vars.PP_TENANT_ID }}
      PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
      SOLUTION_NAME: ${{ inputs.solution-name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate selected solution
        id: selection
        run: .\.github\scripts\Test-SolutionName.ps1 -SolutionName $env:SOLUTION_NAME
      - name: Validate Dev configuration
        run: .\.github\scripts\Test-Configuration.ps1 -ExpectedUrl 'https://orgfd9b912f.crm.dynamics.com'
      - name: Require production protection before exporting
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\.github\scripts\Test-ProductionGate.ps1
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
      - name: Authenticate to Dev
        uses: microsoft/powerplatform-actions/who-am-i@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.PP_ENVIRONMENT_URL }}
          app-id: ${{ env.PP_APP_ID }}
          tenant-id: ${{ env.PP_TENANT_ID }}
          client-secret: ${{ env.PP_CLIENT_SECRET }}
      - name: Create output directory
        run: New-Item -ItemType Directory -Path release | Out-Null
      - name: Export unmanaged recovery and source package
        id: unmanaged
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.PP_ENVIRONMENT_URL }}
          app-id: ${{ env.PP_APP_ID }}
          tenant-id: ${{ env.PP_TENANT_ID }}
          client-secret: ${{ env.PP_CLIENT_SECRET }}
          solution-name: ${{ inputs.solution-name }}
          solution-output-file: release/unmanaged.zip
          managed: false
          run-asynchronously: true
          max-async-wait-time: 30
      - name: Export managed release once
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.PP_ENVIRONMENT_URL }}
          app-id: ${{ env.PP_APP_ID }}
          tenant-id: ${{ env.PP_TENANT_ID }}
          client-secret: ${{ env.PP_CLIENT_SECRET }}
          solution-name: ${{ inputs.solution-name }}
          solution-output-file: release/managed.zip
          managed: true
          run-asynchronously: true
          max-async-wait-time: 30
      - name: Verify package identity and export versions
        id: package
        run: |
          $version = .\.github\scripts\Test-SolutionPackages.ps1 `
            -Managed release\managed.zip -Unmanaged release\unmanaged.zip `
            -ExpectedSolutionName $env:SOLUTION_NAME
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check solution (zero high-severity issues)
        uses: microsoft/powerplatform-actions/check-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.PP_ENVIRONMENT_URL }}
          app-id: ${{ env.PP_APP_ID }}
          tenant-id: ${{ env.PP_TENANT_ID }}
          client-secret: ${{ env.PP_CLIENT_SECRET }}
          path: release/managed.zip
          fail-on-analysis-error: true
          checker-logs-artifact-name: solution-checker
      - name: Record release identity
        id: hash
        env:
          SOLUTION_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $hash = (Get-FileHash release\managed.zip -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          @{
            solution = $env:SOLUTION_NAME
            version = $env:SOLUTION_VERSION
            managedSha256 = $hash
            sourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
          } | ConvertTo-Json | Set-Content release\manifest.json
          "## Release`n`nSolution: $env:SOLUTION_NAME $env:SOLUTION_VERSION`n`nManaged SHA256: $hash`n`nSource commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve unmanaged package even if quality check fails
        if: always() && steps.unmanaged.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-unmanaged-${{ inputs.solution-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/unmanaged.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Store immutable release
        id: release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-release-${{ inputs.solution-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/managed.zip
            release/manifest.json
          if-no-files-found: error
          retention-days: 30

  qa:
    name: Deploy QA
    needs: export
    uses: ./.github/workflows/DeployManagedSolution.yml
    with:
      solution-name: ${{ inputs.solution-name }}
      target: QA
      expected-url: https://org94225411.crm.dynamics.com
      artifact-id: ${{ needs.export.outputs.artifact-id }}
      managed-sha256: ${{ needs.export.outputs.managed-sha256 }}

  prod:
    name: Approve and deploy Prod
    needs: [export, qa]
    uses: ./.github/workflows/DeployManagedSolution.yml
    with:
      solution-name: ${{ inputs.solution-name }}
      target: Prod
      expected-url: https://org4bd02029.crm.dynamics.com
      artifact-id: ${{ needs.export.outputs.artifact-id }}
      managed-sha256: ${{ needs.export.outputs.managed-sha256 }}
